name: CI
'on':
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Pinned on purpose: an unpinned "pip install ruff" silently picked up
      # ruff 0.16, which formats Python blocks inside Markdown, and turned CI
      # red on unrelated PRs. Keep this in sync with the ruff-pre-commit rev
      # in .pre-commit-config.yaml.
      - run: pip install ruff==0.16.1
      - run: ruff check .
      - run: ruff format --check .
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -e . && pip install pytest
      - run: pytest
