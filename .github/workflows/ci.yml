name: CI
'on':
  push:
    branches: [master]
  pull_request:
    branches: [master]
# Minimal token scope. Added 2026-09-20: this workflow had no
# permissions: key, so GITHUB_TOKEN arrived with the repository default,
# which on these repos is write across contents, issues, pull-requests and
# more. Nothing here writes anything; it checks out and runs checks.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # Pinned on purpose: an unpinned "pip install ruff" silently picked up
      # ruff 0.16, which formats Python blocks inside Markdown, and turned CI
      # red on unrelated PRs. Keep this in sync with the ruff-pre-commit rev
      # in .pre-commit-config.yaml.
      - run: pip install ruff==0.16.1
      - run: ruff check .
      - run: ruff format --check .
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -e . && pip install pytest
      - run: pytest
