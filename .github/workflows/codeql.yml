name: CodeQL
'on':
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every github/codeql-action/* step below must stay on the SAME version.
      # A split (for example init 4.37.3 with analyze 4.36.2) fails the run with
      # "Loaded a configuration file for version X, but running version Y".
      # Dependabot groups these under "codeql-action" so they always move together.
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: python
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
